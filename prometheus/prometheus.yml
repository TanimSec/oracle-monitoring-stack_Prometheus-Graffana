# Prometheus Configuration for Dokploy Monitoring Stack
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Alert rule files
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape targets
scrape_configs:
  # 1. Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # 2. Node Exporter (Host Ubuntu metrics: CPU, RAM, Disk, Network)
  # Uses host.docker.internal to reach host-networked Node Exporter
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  # 3. cAdvisor (Per-container CPU, RAM, Network, I/O metrics)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  # 4. Loki (Log engine health & metrics)
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # 5. Alertmanager (Alert dispatch health & metrics)
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # 6. Uptime Kuma (Uptime status & monitor metrics)
  - job_name: 'uptime-kuma'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['uptime-kuma:3001']
